[pytest]
# Backend has no top-level package (`main.py`, `routes/`, `agents/` are imported
# with absolute imports assuming the Backend/ directory itself is on sys.path,
# same as when running `python main.py`). Add it explicitly so `pytest` works
# from any invocation (plain `pytest`, `python -m pytest`, from CI, from an
# IDE) without relying on the current working directory.
pythonpath = .
testpaths = tests
