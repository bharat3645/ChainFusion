name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to avoid burning CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile (catch syntax errors)
        run: python -m compileall -q .

      - name: Run test suite
        env:
          # Dummy credentials: several modules construct API clients at
          # *import* time and need something present to avoid crashing, but
          # the test suite never makes a real network call (routes are
          # tested against in-memory fakes; see tests/conftest.py).
          OPENAI_API_KEY: sk-ci-dummy-key
          TAVILY_API_KEY: tvly-ci-dummy-key
          CDP_API_KEY_NAME: ci-dummy-cdp-key-name
          CDP_API_KEY_PRIVATE_KEY: ci-dummy-cdp-private-key
          REPLICATE_API_TOKEN: r8_ci-dummy-token
        run: pytest -v

  frontend:
    name: Frontend (Next.js + Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: Frontend/yarn.lock

      - name: Install dependencies
        # HUSKY=0 skips the "postinstall: husky install" script. Frontend/ is
        # a subdirectory of this repo (the .git directory lives one level up
        # in the repo root), and husky's install() only ever checks for
        # .git in the current working directory, so it always throws
        # ".git can't be found" here regardless of environment. Yarn Berry
        # treats that build-script failure as fatal to the whole install.
        # Git hooks aren't needed in CI anyway.
        run: yarn install --immutable
        env:
          HUSKY: "0"

      - name: Compile contracts
        run: yarn compile

      - name: Run contract tests
        run: yarn hardhat:test

      - name: Type-check Next.js app
        run: yarn next:check-types

      # Pre-existing lint issues shouldn't block the pipeline; this still
      # surfaces them in the job output for visibility.
      - name: Lint Next.js app
        run: yarn next:lint
        continue-on-error: true
